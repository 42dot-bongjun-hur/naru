<div class="catalog-meta-bar post-meta-bar" aria-label="글 정보">
  <span class="post-meta-category">{{ category_label }}</span>
  <span>발행일: {{ page.published_date }}</span>
  <span>예상 읽기 시간: 약 {{ reading_minutes }}분</span>
  <span>작성: {{ AUTHOR_NAME }}</span>
  <span class="post-tags">{% for slug, label in page.get('tag_routes', []) %}<a href="{{ tag_url(slug) }}">{{ label }}</a>{% if not loop.last %} {% endif %}{% endfor %}</span>
</div>
